# Rebuilds the animated README images and the profile data, then publishes them to the
# orphan `chronos` branch (a single commit, force-pushed). The README references the files
# there through raw.githubusercontent.com, so the default branch never fills with churn.
#
# Optional: add a repository secret CHRONOS_TOKEN (a fine-grained or classic token with
# read access to your profile) so private contributions count in the graph exactly as they
# do on your profile page. Without it the built-in GITHUB_TOKEN is used and only public
# activity is drawn.
name: chronos

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/lib/**'
      - 'site/data/**'
      - 'profile.config.json'
      - 'package.json'
      - '.github/workflows/chronos.yml'

permissions:
  contents: write

concurrency:
  group: chronos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build the scenes from live data
        env:
          GITHUB_TOKEN: ${{ secrets.CHRONOS_TOKEN || secrets.GITHUB_TOKEN }}
          # If the API is unreachable, fall back to the snapshot that ships with the repo
          CHRONOS_CACHE: site/data/profile.sample.json
        run: node scripts/build.mjs

      - name: Publish to the chronos branch
        env:
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          printf '# chronos\n\nGenerated by the `chronos` workflow from the default branch. Do not edit.\n' > README.md
          git init -q -b chronos
          git config user.name 'chronos[bot]'
          git config user.email 'chronos-bot@users.noreply.github.com'
          git add -A
          git commit -q -m "chronos: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" chronos
